name: Features

on:
  push:
    branches-ignore:
      # tested by the release workflow before it publishes
      - release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  features-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run fast feature tests
        run: npm run features:fast

  # a minor or patch bump by Dependabot is merged once its features pass
  automerge:
    needs: features-fast
    if: github.actor == 'dependabot[bot]' && startsWith(github.ref_name, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          types=$(grep -oP 'update-type: version-update:semver-\K\w+' <<< "$MESSAGE" || true)

          if [ -z "$types" ] || grep -qvx -e minor -e patch <<< "$types"; then
            echo "Not a minor or patch bump, left for a review"
            exit 0
          fi

          gh pr merge "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$GITHUB_SHA"
